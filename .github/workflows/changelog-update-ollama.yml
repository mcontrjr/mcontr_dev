name: Update Changelog with AI Analysis

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        pip install requests aiohttp
    
    - name: Setup Ollama
      run: |
        # Install Ollama
        curl -fsSL https://ollama.com/install.sh | sh
        
        # Start Ollama service in background
        ollama serve &
        sleep 10
        
        # Pull a lightweight model for code analysis
        ollama pull codellama:7b-code
        
        # Verify Ollama is running
        curl -s http://localhost:11434/api/tags || (echo "Ollama failed to start" && exit 1)
    
    - name: Get PR information
      id: pr-info
      run: |
        echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
        echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
        echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
        echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
    
    - name: Make script executable
      run: chmod +x .github/scripts/update-changelog-ai.py
    
    - name: Update changelog with AI analysis
      run: |
        python .github/scripts/update-changelog-ai.py \
          --pr-number "${{ steps.pr-info.outputs.PR_NUMBER }}" \
          --pr-title "${{ steps.pr-info.outputs.PR_TITLE }}" \
          --pr-author "${{ steps.pr-info.outputs.PR_AUTHOR }}" \
          --base-sha "${{ steps.pr-info.outputs.BASE_SHA }}" \
          --head-sha "${{ steps.pr-info.outputs.HEAD_SHA }}" \
          --ollama-model "codellama:7b-code" \
          --ollama-url "http://localhost:11434"
    
    - name: Commit changelog changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if [[ $(git status --porcelain) ]]; then
          git add CHANGELOG.md
          git commit -m "chore: update changelog for PR #${{ steps.pr-info.outputs.PR_NUMBER }} (AI-generated)"
          git push
        else
          echo "No changelog changes to commit"
        fi
    
    - name: Cleanup
      if: always()
      run: |
        # Stop Ollama service
        pkill -f ollama || true