name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install --frozen-lockfile
      working-directory: frontend
    
    # - name: Run ESLint
    #   run: npm run lint
    #   working-directory: frontend
    
    - name: Run unit tests (excluding parser-ui.test)
      run: npm run test:coverage
      working-directory: frontend
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and start frontend service
      run: |
        docker build -t frontend-app ./frontend
        docker run -d --name frontend-service -p 5173:5173 frontend-app
        
        # Wait for service to be ready
        timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'
      
    # - name: Install Playwright browsers
    #   run: npx playwright install --with-deps
    #   working-directory: frontend
    
    # - name: Run E2E tests
    #   run: npm run test:e2e
    #   working-directory: frontend
    #   env:
    #     CI: true
    
    - name: Stop frontend service
      if: always()
      run: |
        docker stop frontend-service || true
        docker rm frontend-service || true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage