[tool:pytest]
testpaths = tests
python_paths = .
addopts = -v --tb=short --cov=src --cov=main --cov-report=html --cov-report=term-missing --cov-fail-under=80
markers =
    unit: Unit tests with mocks (default)
    integration: Integration tests requiring running server
    slow: Slow running tests
    api: API endpoint tests
    parser: Parser functionality tests  
    database: Database interaction tests