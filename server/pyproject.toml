    "pandas>=2.0.0",
    "psutil>=7.1.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.11.10",
    "pypdf>=6.1.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
